[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.dat"
exclude_filter="Tools/*,Tests/*,Assets/Brand/bathys-master.png,Screenshots/*,WebBuild/*"
export_path="WebBuild/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"theme-color\" content=\"#071c29\">\n<meta name=\"description\" content=\"Bathys - explore the depths of Lac des Iles. An educational dive simulation.\">\n<style>\nbody { background: #071c29; }\n#status { background: radial-gradient(ellipse at center, #103344 0%, #071c29 65%); }\n#status-splash.fullsize--false, #status-splash.fullsize--true {\n  width: clamp(128px, 24vh, 192px); height: auto;\n  max-width: 42vw; max-height: 32vh; object-fit: contain;\n  transform: translateY(-40px);\n}\n#status::after {\n  content: \"BATHYS\"; position: absolute;\n  top: calc(50% + 72px); left: 0; right: 0;\n  color: #e6f8f4; text-align: center;\n  font: 600 28px/1.2 system-ui, sans-serif; letter-spacing: .22em;\n  text-indent: .22em;\n}\n#status-progress {\n  top: calc(50% + 130px); bottom: auto; width: 176px; height: 4px;\n  border: 0; border-radius: 8px; overflow: hidden; accent-color: #5ce1dc;\n}\n#status-progress::-webkit-progress-bar { background: #244754; }\n#status-progress::-webkit-progress-value { background: #5ce1dc; border-radius: 8px; }\n#status-progress::-moz-progress-bar { background: #5ce1dc; border-radius: 8px; }\n#status-notice { max-width: 34rem; }\n</style>\n"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false

